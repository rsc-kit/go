name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: go vet and go test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: gofmt -l . && test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  conformance:
    name: rsc-kit conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: oven-sh/setup-bun@v2
      # The suite from rsc-kit's main, built from source: the contract this
      # adapter must keep is whatever the engine reads today, not whatever
      # was last published.
      - name: Build the conformance suite
        run: |
          git clone --depth 1 https://github.com/rsc-kit/rsc-kit /tmp/rsc-kit
          cd /tmp/rsc-kit && bun install --frozen-lockfile && cd packages/core && bun run build
      - name: Run it against this adapter
        run: |
          go run ./cmd/conformance -addr 127.0.0.1:8123 -secret test -manifest /tmp/rsc-host.json &
          for i in $(seq 1 60); do curl -s -o /dev/null 127.0.0.1:8123/ && break; sleep 1; done
          node /tmp/rsc-kit/packages/core/dist/conformance.js \
            --endpoint http://127.0.0.1:8123/__rsc/host-call --secret test --manifest /tmp/rsc-host.json
